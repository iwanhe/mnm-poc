name: Validate APEXlang

on:
  pull_request:
    paths:
      - 'apex/**'
      - 'tools/apexgen/**'
      - '.github/workflows/validate-apex.yml'
  push:
    branches:
      - main
      - 'claude/**'
    paths:
      - 'apex/**'
      - 'tools/apexgen/**'
      - '.github/workflows/validate-apex.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_DIR: apex/mbms
      # Ganti dengan URL zip versi tertentu (>= 26.2) untuk build yang reprodusibel.
      SQLCL_URL: https://download.oracle.com/otn_software/java/sqldeveloper/sqlcl-latest.zip
      SQLCL_BIN: /opt/sqlcl/bin/sql
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Structural check (blok, referensi @)
        run: python3 tools/apexgen/check_apx.py "$APP_DIR"

      - name: Install SQLcl
        run: |
          curl -fsSL -o /tmp/sqlcl.zip "$SQLCL_URL"
          sudo unzip -q /tmp/sqlcl.zip -d /opt
          "$SQLCL_BIN" -V

      - name: Check mmdVersion vs SQLcl
        run: |
          echo "Application mmdVersion:"
          cat "$APP_DIR/.apex/apexlang.json"

      - name: apex validate
        run: .claude/skills/apexlang/26.2/apexlang-compile/scripts/validate-apex-app.sh "$APP_DIR"

      - name: Build import zip
        if: success()
        run: scripts/package-apex.sh

      - name: Upload import zip
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mbms-apexlang
          path: dist/mbms-apexlang.zip
