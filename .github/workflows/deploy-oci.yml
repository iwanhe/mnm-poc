name: Deploy to OCI (APEX)

# Deploy manual ke APEX di OCI (Autonomous Database), schema XTDCLATRX.
#
# Setup sekali (Settings -> Environments -> New environment: oci-xtdclatrx):
#   Secrets:
#     ADB_WALLET_BASE64  isi wallet zip dalam base64:  base64 -w0 Wallet_xxx.zip
#     DB_USERNAME        XTDCLATRX
#     DB_PASSWORD        password schema
#   Variables:
#     DB_TNS_ALIAS       alias di tnsnames.ora wallet, mis. xxx_high
#     APEX_WORKSPACE     nama workspace APEX yang memakai schema XTDCLATRX
#     APEX_APP_ID        (opsional) application ID tujuan, mis. 1100.
#                        Kosong = ID dari source/otomatis oleh import.
#   Disarankan: aktifkan "Required reviewers" di environment ini.
#
# Network: runner GitHub (IP publik dinamis) harus bisa ke ADB port 1522.
# Bila ADB memakai ACL / private endpoint, gunakan self-hosted runner di VCN.

on:
  workflow_dispatch:
    inputs:
      install_db:
        description: 'Instal objek database MBMS (tabel, package, view, data dummy). Hanya untuk schema yang BELUM berisi objek MBMS.'
        type: boolean
        default: false
      deploy_app:
        description: 'Import aplikasi APEX (apex/mbms)'
        type: boolean
        default: true
      confirm_schema:
        description: 'Ketik nama schema tujuan (mis. XTDCLATRX) untuk konfirmasi'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-oci-xtdclatrx
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: oci-xtdclatrx
    env:
      APP_DIR: apex/mbms
      # Ganti dengan URL zip versi tertentu (>= 26.2) untuk build yang reprodusibel.
      SQLCL_URL: https://download.oracle.com/otn_software/java/sqldeveloper/sqlcl-latest.zip
      SQLCL_BIN: /opt/sqlcl/bin/sql
      ADB_WALLET: /tmp/adb-wallet.zip
      DB_USERNAME: ${{ secrets.DB_USERNAME }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_TNS_ALIAS: ${{ vars.DB_TNS_ALIAS }}
      APEX_WORKSPACE: ${{ vars.APEX_WORKSPACE }}
      APEX_APP_ID: ${{ vars.APEX_APP_ID }}
    steps:
      - name: Check config & konfirmasi
        env:
          ADB_WALLET_BASE64: ${{ secrets.ADB_WALLET_BASE64 }}
          CONFIRM_SCHEMA: ${{ inputs.confirm_schema }}
        run: |
          missing=0
          for v in ADB_WALLET_BASE64 DB_USERNAME DB_PASSWORD DB_TNS_ALIAS APEX_WORKSPACE; do
            if [[ -z "${!v}" ]]; then echo "::error::$v belum di-set di environment oci-xtdclatrx"; missing=1; fi
          done
          [[ $missing -eq 0 ]] || exit 1
          if [[ "${CONFIRM_SCHEMA^^}" != "${DB_USERNAME^^}" ]]; then
            echo "::error::confirm_schema ('$CONFIRM_SCHEMA') tidak sama dengan DB_USERNAME. Deploy dibatalkan."
            exit 1
          fi
          if [[ -n "$APEX_APP_ID" && ! "$APEX_APP_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::APEX_APP_ID harus angka"; exit 1
          fi
          if [[ ! "$APEX_WORKSPACE" =~ ^[A-Za-z0-9_$#.-]+$ ]]; then
            echo "::error::APEX_WORKSPACE berisi karakter tidak valid"; exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Structural check (blok, referensi @)
        run: python3 tools/apexgen/check_apx.py "$APP_DIR"

      - name: Install SQLcl
        run: |
          curl -fsSL -o /tmp/sqlcl.zip "$SQLCL_URL"
          sudo unzip -q /tmp/sqlcl.zip -d /opt
          "$SQLCL_BIN" -V

      - name: apex validate
        run: .claude/skills/apexlang/26.2/apexlang-compile/scripts/validate-apex-app.sh "$APP_DIR"

      - name: Siapkan wallet
        env:
          ADB_WALLET_BASE64: ${{ secrets.ADB_WALLET_BASE64 }}
        run: |
          umask 077
          echo "$ADB_WALLET_BASE64" | base64 -d > "$ADB_WALLET"
          unzip -l "$ADB_WALLET" | grep -q tnsnames.ora || { echo "::error::Wallet tidak berisi tnsnames.ora"; exit 1; }

      - name: Preflight (koneksi, versi APEX, workspace, objek MBMS)
        timeout-minutes: 5
        id: preflight
        run: |
          out=$(scripts/oci-sql.sh <<SQL
          set heading off pagesize 0
          select 'DB_USER=' || user from dual;
          select 'APEX_VERSION=' || version_no from apex_release;
          select 'WS_OK=' || count(*) from apex_workspace_schemas
           where workspace_name = upper('$APEX_WORKSPACE') and schema = user;
          select 'MBMS_OBJECTS=' || count(*) from user_objects
           where object_name in ('SYS_ROLE','SYS_USER_ROLE','SYS_DOC_TYPE','SYS_APPROVAL',
                                 'MDM_ITEM','PRT_JOB_ORDER','PRJ_PROJECT','PUR_REQUISITION',
                                 'INV_STOCK_TXN','MBMS_SEC','MBMS_DOC','MBMS_INV','MBMS_APPROVAL');
          SQL
          ) || { rc=$?; echo "$out"; echo "::error::SQLcl gagal (exit $rc). Lihat output di atas."; exit $rc; }
          echo "$out"
          ver=$(sed -n 's/^APEX_VERSION=//p' <<<"$out" | tr -d '[:space:]')
          ws_ok=$(sed -n 's/^WS_OK=//p' <<<"$out" | tr -d '[:space:]')
          objs=$(sed -n 's/^MBMS_OBJECTS=//p' <<<"$out" | tr -d '[:space:]')
          major=${ver%%.*}; rest=${ver#*.}; minor=${rest%%.*}
          if (( major < 26 || (major == 26 && minor < 2) )); then
            echo "::error::APEX di target versi $ver. APEXlang app ini butuh APEX >= 26.2."
            exit 1
          fi
          if [[ "$ws_ok" != "1" ]]; then
            echo "::error::Schema $DB_USERNAME tidak terdaftar di workspace $APEX_WORKSPACE."
            exit 1
          fi
          echo "mbms_objects=$objs" >> "$GITHUB_OUTPUT"
          {
            echo "### Preflight"
            echo "- APEX version: \`$ver\`"
            echo "- Workspace: \`$APEX_WORKSPACE\`"
            echo "- Objek MBMS yang sudah ada di schema: \`$objs\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install objek database
        if: inputs.install_db
        run: |
          if [[ "${{ steps.preflight.outputs.mbms_objects }}" != "0" ]]; then
            echo "::error::Schema sudah berisi objek MBMS. Install dibatalkan supaya tidak menimpa/bentrok. Jalankan ulang dengan install_db=false, atau bersihkan schema secara manual."
            exit 1
          fi
          scripts/oci-sql.sh <<'SQL'
          @database/mbms_install.sql
          prompt == Objek invalid:
          select object_type, object_name from user_objects where status = 'INVALID' order by 1, 2;
          SQL

      - name: Import aplikasi APEX
        if: inputs.deploy_app
        run: |
          app_dir=$(cd "$APP_DIR" && pwd -P)
          if [[ -n "$APEX_APP_ID" ]]; then
            set_app_id="apex_application_install.set_application_id(p_application_id => $APEX_APP_ID);"
          else
            set_app_id=""
          fi
          scripts/oci-sql.sh <<SQL
          begin
             apex_application_install.set_workspace(p_workspace => '$APEX_WORKSPACE');
             apex_application_install.set_schema(p_schema => user);
             $set_app_id
             apex_application_install.set_auto_install_sup_obj(p_auto_install_sup_obj => true);
          end;
          /
          apex import -input "$app_dir"
          SQL

      - name: Verifikasi
        timeout-minutes: 5
        if: inputs.deploy_app
        run: |
          out=$(scripts/oci-sql.sh <<SQL
          set heading off pagesize 0
          select 'APP=' || application_id || ' | ' || application_name || ' | updated ' ||
                 to_char(last_updated_on, 'YYYY-MM-DD HH24:MI')
            from apex_applications
           where workspace = upper('$APEX_WORKSPACE')
             and (alias = 'MBMS' or application_id = to_number(nullif('$APEX_APP_ID', '')))
           order by last_updated_on desc
           fetch first 1 row only;
          SQL
          ) || { rc=$?; echo "$out"; echo "::error::SQLcl gagal (exit $rc). Lihat output di atas."; exit $rc; }
          echo "$out"
          app=$(sed -n 's/^APP=//p' <<<"$out")
          if [[ -z "$app" ]]; then
            echo "::error::Aplikasi tidak ditemukan di workspace $APEX_WORKSPACE setelah import."
            exit 1
          fi
          echo "### Aplikasi terpasang" >> "$GITHUB_STEP_SUMMARY"
          echo "- $app" >> "$GITHUB_STEP_SUMMARY"

      - name: Hapus wallet
        if: always()
        run: rm -f "$ADB_WALLET"
