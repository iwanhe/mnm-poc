name: E2E Playwright (oracleapex.com)

# Dijalankan manual: aplikasi di oracleapex.com di-import manual (D-10),
# jadi test dijalankan setelah import versi baru.
on:
  workflow_dispatch:
    inputs:
      project:
        description: 'Playwright project'
        required: false
        default: all
        type: choice
        options:
          - all
          - mobile-chrome
          - mobile-iphone-viewport
          - desktop-chrome

permissions:
  contents: read

concurrency:
  group: e2e-oracleapex
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: tests/e2e
    env:
      APEX_APP_URL: ${{ secrets.APEX_APP_URL }}
      APEX_USERNAME: ${{ secrets.APEX_USERNAME }}
      APEX_PASSWORD: ${{ secrets.APEX_PASSWORD }}
      APEX_COMPARE_URL: ${{ secrets.APEX_COMPARE_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        run: |
          missing=""
          for s in APEX_APP_URL APEX_USERNAME APEX_PASSWORD; do
            [ -z "${!s}" ] && missing="$missing $s"
          done
          if [ -n "$missing" ]; then
            echo "::error::Secret belum di-set:$missing (Settings > Secrets and variables > Actions)"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Dump Universal Theme nav resize logic (diagnostik)
        continue-on-error: true
        run: |
          curl -fsSL -o /tmp/theme42.js "https://static.oracle.com/cdn/apex/26.2.1/themes/theme_42/26.2/js/theme42.js" \
            || curl -fsSL -o /tmp/theme42.js "https://static.oracle.com/cdn/apex/26.2.1/themes/theme_42/26.2/js/theme42.min.js"
          node -e '
            const s = require("fs").readFileSync("/tmp/theme42.js", "utf8");
            let i = -1, n = 0;
            while ((i = s.indexOf("onResize", i + 1)) !== -1 && n < 6) {
              n++;
              console.log("----- onResize #" + n + " @" + i + " -----");
              console.log(s.substring(Math.max(0, i - 1500), i + 2500));
            }
          '

      - name: Run tests
        env:
          PW_PROJECT: ${{ inputs.project }}
        run: |
          if [ -z "$PW_PROJECT" ] || [ "$PW_PROJECT" = "all" ]; then
            npx playwright test
          else
            npx playwright test --project="$PW_PROJECT"
          fi

      - name: Upload report (HTML, trace, video, screenshot, browser log)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            tests/e2e/playwright-report
            tests/e2e/test-results
          retention-days: 14
